---
- name: Linux patch
  hosts: linux_hosts
  become: true
  gather_facts: true
  serial: 3

  vars:
    reboot_allowed: false
    patch_log_dir:  /var/log/awx-patching

  pre_tasks:
    - name: Create patch log directory
      ansible.builtin.file:
        path:  "{{ patch_log_dir }}"
        state: directory
        owner: root
        group: root
        mode:  "0750"
      tags: [always]

    - name: Show host info
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} |
          group(s): {{ group_names | join(', ') }} |
          {{ ansible_distribution }} {{ ansible_distribution_version }} |
          pkg_mgr: {{ ansible_pkg_mgr }}
      tags: [always]

  tasks:

    # ── Package updates ───────────────────────────────────────────────────────

    - name: APT — refresh cache
      ansible.builtin.apt:
        update_cache:     true
        cache_valid_time: 0
      when: ansible_os_family == "Debian"
      tags: [packages]

    - name: APT — dist-upgrade
      ansible.builtin.apt:
        upgrade:      dist
        autoremove:   true
        autoclean:    true
        dpkg_options: "force-confdef,force-confold"
      when: ansible_os_family == "Debian"
      tags: [packages]

    - name: DNF — upgrade all packages
      ansible.builtin.dnf:
        name:         "*"
        state:        latest
        update_cache: true
        update_only:  true
      when:
        - ansible_os_family == "RedHat"
        - ansible_pkg_mgr in ["dnf", "dnf5"]
      tags: [packages]

    - name: YUM — upgrade all packages
      ansible.builtin.yum:
        name:         "*"
        state:        latest
        update_cache: true
      when:
        - ansible_os_family == "RedHat"
        - ansible_pkg_mgr == "yum"
      tags: [packages]
